services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DB_URL: mongodb://mongo:27017/stallio
      CLIENT_URL: http://localhost:3000
    ports: ["8000:8000"]
    depends_on: [mongo]
  socket:
    build: ./socket
    env_file: ./socket/.env
    ports: ["4000:4000"]
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api/v2
        VITE_SOCKET_URL: http://localhost:4000/
        VITE_PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-test}
    ports: ["3000:80"]
volumes:
  mongo-data:
